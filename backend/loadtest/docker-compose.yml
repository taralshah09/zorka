# Throwaway local Postgres for load tests, so results measure the backend instead of the
# network trip to Neon. Bound to 127.0.0.1 with trust auth: no password, nothing reachable off this machine.
#
#   docker compose -f loadtest/docker-compose.yml up -d
#   docker compose -f loadtest/docker-compose.yml down -v     # stop and wipe the data
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: zorka_load
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zorka_load"]
      interval: 2s
      timeout: 3s
      retries: 20
